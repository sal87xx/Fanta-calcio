<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fanta Calcetto</title>


<link rel="stylesheet" href="style.css">


<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0b3d2e">


</head>


<body>


<div class="logo">

<img src="logo.png" width="100" alt="Logo Fanta Calcetto">

</div>


<h1>⚽ Fanta Calcetto</h1>



<div class="partita">


<h2>🏟️ Prossima partita</h2>


<div id="infoPartita">

Caricamento partita...

</div>



<div class="boxPosti">

👥 Posti disponibili:

<strong id="posti">
0/10
</strong>

</div>



<div id="infoCompleta"></div>



<h3>📝 Iscriviti</h3>


<input 
id="nome"
type="text"
placeholder="Inserisci nome">



<button onclick="iscriviti()">

✅ Partecipa

</button>



<h3>🟢 Convocati</h3>


<ul id="convocati"></ul>



<h3>⏳ Lista d'attesa</h3>


<ul id="attesa"></ul>



<button onclick="condividiWhatsApp()">

📲 Condividi partita

</button>


</div>



<script type="module" src="./app.js"></script>



<script>

if ("serviceWorker" in navigator) {

window.addEventListener("load", () => {

navigator.serviceWorker.register("sw.js");

});

}

</script>



</body>

</html>
