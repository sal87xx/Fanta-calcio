<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Fanta Calcetto</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<h1>👑 Admin Fanta Calcetto</h1>


<div id="login">

<input id="email" type="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">


<button onclick="entra()">
🔐 Entra
</button>


</div>




<div id="pannello" style="display:none">


<h2>⚽ Partita attuale</h2>


<input id="data" placeholder="Data">

<input id="ora" placeholder="Ora">

<input id="campo" placeholder="Campo">

<input id="quota" placeholder="Quota">


<button onclick="salvaPartita()">
💾 Aggiorna partita
</button>



<hr>



<h2>📅 Aggiungi al calendario</h2>


<input id="calData" placeholder="Data partita">


<input id="calOra" placeholder="Ora">


<input id="calCampo" placeholder="Campo">


<input id="calQuota" placeholder="Quota">



<button onclick="aggiungiCalendario()">

➕ Salva nel calendario

</button>



<h2>👥 Giocatori</h2>


<h3>✅ Convocati</h3>

<ul id="convocati"></ul>



<h3>⏳ Lista d'attesa</h3>

<ul id="attesa"></ul>



</div>



<script type="module" src="./admin.js"></script>



</body>

</html>
