<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Fanta Calcetto</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<h1>👑 Admin Fanta Calcetto</h1>



<div id="login">


<h2>🔐 Accesso Admin</h2>


<input 
id="email"
type="email"
placeholder="Email">


<br><br>


<input 
id="password"
type="password"
placeholder="Password">


<br><br>


<button onclick="entra()">

Entra

</button>


</div>







<div id="pannello" style="display:none">



<h2>⚽ Modifica partita principale</h2>


<input 
id="data"
placeholder="Data">


<br>


<input 
id="ora"
placeholder="Ora">


<br>


<input 
id="campo"
placeholder="Campo">


br>


<input 
id="quota"
placeholder="Quota">


<br><br>


<button onclick="salvaPartita()">

💾 Salva partita

</button>





<hr>





<h2>📅 Calendario partite</h2>



<input 
id="calData"
placeholder="Data partita">


<br>


<input 
id="calOra"
placeholder="Ora">


<br>


<input 
id="calCampo"
placeholder="Campo">


<br>


<input 
id="calQuota"
placeholder="Quota">


<br><br>


<button onclick="aggiungiCalendario()">

➕ Aggiungi al calendario

</button>





<h3>📋 Partite inserite</h3>


<ul id="listaCalendario"></ul>






<hr>





<h2>👥 Gestione giocatori</h2>



<h3>✅ Convocati</h3>

<ul id="convocati"></ul>




<h3>⏳ Lista d'attesa</h3>

<ul id="attesa"></ul>



</div>







<script type="module" src="./admin.js"></script>


</body>

</html>
